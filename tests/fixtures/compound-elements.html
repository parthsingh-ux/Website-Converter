<!doctype html><html><body><section class="example">
<h2><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M2 12h20"/></svg>Opening hours</h2>
<a href="#contact"><i class="fa fa-phone" aria-hidden="true"></i> Call us</a>
<svg viewBox="0 0 24 24" role="img" aria-label="Clock"><defs><symbol id="clock"><circle cx="12" cy="12" r="10"/></symbol></defs><use href="#clock"/></svg>
<table><caption>Office hours</caption><thead><tr><th scope="col">Day</th><th scope="col">Hours</th></tr></thead><tbody><tr><td rowspan="2">Monday &amp; Tuesday</td><td>9:00–17:00</td></tr><tr><td><strong>By appointment</strong></td></tr></tbody><tfoot><tr><td colspan="2">Closed on holidays</td></tr></tfoot></table>
<form id="contact" action="/contact" method="post"><label for="name">Name</label><input id="name" name="name" required placeholder="Your name"><input type="checkbox" name="consent" checked><select name="service"><option value="roof" selected>Roof repair</option><option value="other">Other</option></select><textarea name="message">Existing message</textarea><button type="submit">Send</button></form>
<picture><source media="(max-width: 600px)" srcset="/small.webp"><img src="/large.webp" alt="House"></picture>
<iframe title="Map" src="about:blank"></iframe>
</section></body></html>
